version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Unified Service (Sync + Leaderboard in single lightweight container)
  # ----------------------------------------------------------------------------
  technika-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: technika-backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      - SERVICE_MODE=all
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - MONGODB_URI=mongodb+srv://admin:San123456789@technika.pzyvkza.mongodb.net/?appName=technika
      - MONGODB_DB_NAME=test
      - SUPABASE_URL=https://your-project.supabase.co
      - SUPABASE_SERVICE_ROLE_KEY=your-supabase-service-role-key
      - CRON_SYNC_INTERVAL_SEC=30
      - SYNC_BATCH_SIZE=500
      - ENABLE_AUTO_CRON_SYNC=true
      - JWT_SECRET=technika_volunteer_jwt_super_secret_key_2026
      - ADMIN_API_KEY=technika_master_admin_secret_key_2026
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
